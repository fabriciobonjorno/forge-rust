[package]
name = "forge"
description = "Application runtime facade for Forge applications"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
forge-audit = { path = "../forge-audit" }
forge-auth = { path = "../forge-auth" }
forge-config = { path = "../forge-config" }
forge-core = { path = "../forge-core" }
forge-db = { path = "../forge-db" }
forge-events = { path = "../forge-events" }
forge-http = { path = "../forge-http" }
forge-jobs = { path = "../forge-jobs" }
forge-security = { path = "../forge-security" }
forge-tenancy = { path = "../forge-tenancy" }
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
sqlx = { workspace = true, default-features = false, features = [] }

[features]
default = ["postgres"]
postgres = ["forge-db/postgres"]
mysql = ["forge-db/mysql"]
sqlite = ["forge-db/sqlite"]
testing = []

[lints]
workspace = true
