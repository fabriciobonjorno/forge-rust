# Runs the production image locally. This is a development convenience,
# not a production orchestration contract.
services:
  db:
    image: postgres:18
    environment:
      # Development-only credentials. Never reuse them in a deployment.
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: catalog_development
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username=app", "--dbname=catalog_development"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    image: catalog:dev
    command: ["migrate"]
    environment:
      FORGE_DATABASE_URL: postgres://app:app@db:5432/catalog_development
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    image: catalog:dev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      FORGE_LOG: info
      FORGE_DATABASE_URL: postgres://app:app@db:5432/catalog_development
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Must exceed FORGE_SHUTDOWN_GRACE_SECS (15s by default).
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
